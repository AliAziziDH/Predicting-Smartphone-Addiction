[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "playground-series-s6e8-addiction"
version = "0.1.0"
description = "Kaggle Predicting Smartphone Addiction Solution"
authors = [
    { name = "Ali Azizi" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "8.0"
addopts = "-ra -v"
testpaths = [
    "tests",
]
